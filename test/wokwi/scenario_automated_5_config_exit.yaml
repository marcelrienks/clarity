name: 'Clarity Automated Integration Test - Part 5: Config Exit'
version: 1
steps:
  # Part 5 of 5. Wokwi caps a session at 5 min wall-clock, so each part boots fresh.
  # Boot to the Oil panel
  - wait-serial: '[T] System ready'
  - wait-serial: '[T] Pressure reading:'
  - delay: 300ms

  # Step 14: Configuration Access via Button Action
  # - Long press loads Config panel with main preference settings
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  # Long press fires while held, so wait before releasing
  - wait-serial: '[T] Long press triggered during hold'
  - wait-serial: '[T] Panel transition requested: ConfigPanel'
  - wait-serial: '[T] ConfigPanel loaded successfully'
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  # Give ConfigPanel time to finish building before the next press: a press 300ms
  # after the load stalled the simulator in Wokwi (observed, cause not investigated)
  - delay: 1000ms

  # - Main menu: short press until Exit is highlighted
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - delay: 800ms  # Short press: held below the long press threshold (1500ms); shorter holds get missed by the slow firmware loop
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - wait-serial: '[T] ConfigPanel: Display option highlighted'
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - delay: 800ms  # Short press: held below the long press threshold (1500ms); shorter holds get missed by the slow firmware loop
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - wait-serial: '[T] ConfigPanel: Oil Press. option highlighted'
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - delay: 800ms  # Short press: held below the long press threshold (1500ms); shorter holds get missed by the slow firmware loop
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - wait-serial: '[T] ConfigPanel: Oil Temp. option highlighted'
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - delay: 800ms  # Short press: held below the long press threshold (1500ms); shorter holds get missed by the slow firmware loop
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - wait-serial: '[T] ConfigPanel: Splash Scr. option highlighted'
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - delay: 800ms  # Short press: held below the long press threshold (1500ms); shorter holds get missed by the slow firmware loop
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - wait-serial: '[T] ConfigPanel: System option highlighted'
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - delay: 800ms  # Short press: held below the long press threshold (1500ms); shorter holds get missed by the slow firmware loop
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - wait-serial: '[T] ConfigPanel: Exit option highlighted'
  - delay: 200ms

  # Step 20: Return to Oil Panel with Applied Settings
  # - Long press on Exit → Oil panel loads with night theme
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  # Long press fires while held, so wait before releasing
  - wait-serial: '[T] Long press triggered during hold'
  - wait-serial: '[T] ConfigPanel: Executing exit function'
  - wait-serial: '[T] Panel transition requested: OemOilPanel'
  - wait-serial: '[T] OemOilPanel loaded successfully'
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 300ms
