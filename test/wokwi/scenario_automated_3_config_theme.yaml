name: 'Clarity Automated Integration Test - Part 3: Config Theme'
version: 1
steps:
  # Part 3 of 5. Wokwi caps a session at 5 min wall-clock, so each part boots fresh.
  # Boot to the Oil panel
  - wait-serial: '[T] System ready'
  - wait-serial: '[T] Pressure reading:'
  - delay: 300ms

  # Step 14: Configuration Access via Button Action
  # - Long press loads Config panel with main preference settings
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  # Long press fires while held, so wait before releasing
  - wait-serial: '[T] Long press triggered during hold'
  - wait-serial: '[T] Panel transition requested: ConfigPanel'
  - wait-serial: '[T] ConfigPanel loaded successfully'
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  # Give ConfigPanel time to finish building before the next press: a press 300ms
  # after the load stalled the simulator in Wokwi (observed, cause not investigated)
  - delay: 1000ms

  # Step 15: Configuration Navigation to Theme Settings
  # - Main menu order: Button, Display, Oil Press., Oil Temp., Splash Scr., System, Exit
  # - Short press moves to Display (holds the Theme item)
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - delay: 800ms  # Short press: held below the long press threshold (1500ms); shorter holds get missed by the slow firmware loop
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - wait-serial: '[T] ConfigPanel: Display option highlighted'
  - delay: 200ms

  # Step 16: Theme Submenu Access
  # - Long press enters Display, long press again opens the Theme options (Day, Night)
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  # Long press fires while held, so wait before releasing
  - wait-serial: '[T] Long press triggered during hold'
  - wait-serial: '[T] ConfigPanel: Entering section'
  - wait-serial: '[T] ConfigPanel: Section style_manager menu loaded'
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 1000ms  # menu rebuilt: wait before the next press
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  # Long press fires while held, so wait before releasing
  - wait-serial: '[T] Long press triggered during hold'
  - wait-serial: '[T] ConfigPanel: Options menu for style_manager.theme loaded'
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 1000ms  # menu rebuilt: wait before the next press

  # Step 17: Theme Selection Navigation
  # - Short press moves from Day to Night
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - delay: 800ms  # Short press: held below the long press threshold (1500ms); shorter holds get missed by the slow firmware loop
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - wait-serial: 'Night option highlighted'  # option labels are padded, so match from the label
  - delay: 200ms

  # Step 18: Theme Setting Application
  # - Long press applies Night and returns to the Display section menu
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  # Long press fires while held, so wait before releasing
  - wait-serial: '[T] Long press triggered during hold'
  - wait-serial: '[T] ConfigPanel: Applying style_manager.theme setting Night'
  - wait-serial: '[T] ConfigPanel: Returned to section style_manager menu'
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 1000ms  # menu rebuilt: wait before the next press
