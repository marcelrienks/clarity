name: 'Clarity Automated Integration Test - Part 4: Config Sections'
version: 1
steps:
  # Part 4 of 5. Wokwi caps a session at 5 min wall-clock, so each part boots fresh.
  # Boot to the Oil panel. A short press 150 ms into the fade-in skips the splash (Q-08);
  # part 1 presses during the hold, part 5 during the fade-out.
  # A press after the splash would reach the Oil panel, which logs no skip line, and the wait fails
  - wait-serial: '[T] System ready'
  - wait-serial: '[T] SplashPanel loaded successfully'
  - delay: 150ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - delay: 150ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - wait-serial: '[T] SplashPanel short press - skipping to target panel'
  - wait-serial: '[T] Pressure reading:'
  - delay: 300ms

  # Step 14: Configuration Access via Button Action
  # - Long press loads Config panel with main preference settings
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  # Long press fires while held, so wait before releasing
  - wait-serial: '[T] Long press triggered during hold'
  - wait-serial: '[T] Panel transition requested: ConfigPanel'
  - wait-serial: '[T] ConfigPanel loaded successfully'
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  # Give ConfigPanel time to finish building before the next press: a press 300ms
  # after the load stalled the simulator in Wokwi (observed, cause not investigated)
  - delay: 1000ms

  # Step 15: Configuration section navigation and Back (Q-09)
  # - Main menu order: Button, Display, ...; it opens on Button, so a long press enters that section
  # - The Display section is covered by part 3
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  # Long press fires while held, so wait before releasing
  - wait-serial: '[T] Long press triggered during hold'
  - wait-serial: '[T] ConfigPanel: Entering section'
  - wait-serial: '[T] ConfigPanel: Section button_sensor menu loaded'
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 1000ms  # menu rebuilt: wait before the next press

  # Step 16: Debounce options (3 values, then Back); Back returns to the section menu, not the main menu
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  # Long press fires while held, so wait before releasing
  - wait-serial: '[T] Long press triggered during hold'
  - wait-serial: '[T] ConfigPanel: Options menu for button_sensor.debounce_ms loaded'
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 1000ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - delay: 800ms  # Short press: held below the long press threshold (1500ms); shorter holds get missed by the slow firmware loop
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 400ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - delay: 800ms  # Short press: held below the long press threshold (1500ms); shorter holds get missed by the slow firmware loop
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 400ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - delay: 800ms  # Short press: held below the long press threshold (1500ms); shorter holds get missed by the slow firmware loop
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 400ms
  - wait-serial: '[T] ConfigPanel: Back option highlighted'
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  # Long press fires while held, so wait before releasing
  - wait-serial: '[T] Long press triggered during hold'
  - wait-serial: '[T] ConfigPanel: Returned to section button_sensor menu'
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 1000ms

  # Step 19: Configuration Exit Navigation
  # - Button section menu: Debounce, Long Press, Back; a long press on Back returns to the main menu
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - delay: 800ms  # Short press: held below the long press threshold (1500ms); shorter holds get missed by the slow firmware loop
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 400ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - delay: 800ms  # Short press: held below the long press threshold (1500ms); shorter holds get missed by the slow firmware loop
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 400ms
  - wait-serial: '[T] ConfigPanel: Back option highlighted'
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  # Long press fires while held, so wait before releasing
  - wait-serial: '[T] Long press triggered during hold'
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 200ms
