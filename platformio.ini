[platformio]
; Default environments to build (excludes test environments)
default_envs = debug-local, debug-upload, release

[esp32_base]
platform = espressif32 @ 8.0.0
board = nodemcu-32s
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
framework = arduino
board_build.partitions = partitions.csv
lib_deps = 
	lvgl/lvgl @ 9.3.0
	lovyan03/LovyanGFX @ 1.2.7
build_flags = 
	-std=gnu++17
	-D LV_CONF_INCLUDE_SIMPLE
	-D LV_KCONFIG_IGNORE
	-I include
build_unflags = 
	-std=gnu++11
; Project sources only, not libraries
build_src_flags =
	-Wall
	-Wextra
	-Wshadow
	-Wnon-virtual-dtor
	-Woverloaded-virtual
	-Wdouble-promotion
	-Wformat=2
	-Wimplicit-fallthrough
	-Wnull-dereference

; ============================================================================
; TEST ENVIRONMENTS
; ============================================================================


[env:test-wokwi]
extends = esp32_base
build_type = debug
build_flags = 
	${esp32_base.build_flags}
	-D CLARITY_DEBUG
	-D CORE_DEBUG_LEVEL=0
	-D TEST_LOGS
	-D WOKWI_EMULATOR
	-g3
	-Og
lib_deps = 
	${esp32_base.lib_deps}


; Release-like build for Wokwi: no CLARITY_DEBUG, so release-only paths run
; (D-03). Errors are injected with the GPIO 34 button (test_inject.h).
[env:test-wokwi-release]
extends = esp32_base
build_flags =
	${esp32_base.build_flags}
	-D CORE_DEBUG_LEVEL=0
	-D TEST_LOGS
	-D WOKWI_EMULATOR
	-D CLARITY_TEST_INJECT_ERROR
	-D CLARITY_TEST_SEED_INVALID_PANEL
	-Os
lib_deps =
	${esp32_base.lib_deps}


; ============================================================================
; BUILD ENVIRONMENTS
; ============================================================================


[env:debug-local]
extends = esp32_base
build_type = debug
build_flags = 
	${esp32_base.build_flags}
	-D CLARITY_DEBUG
	-D CORE_DEBUG_LEVEL=5
	-D TEST_LOGS
	-D WOKWI_EMULATOR
	-g3
	-Og
lib_deps = 
	${esp32_base.lib_deps}

[env:debug-upload]
extends = esp32_base
build_type = debug
build_flags = 
	${esp32_base.build_flags}
	-D INVERT
	-D CLARITY_DEBUG
	-D CORE_DEBUG_LEVEL=3
	-g3
	-Og
lib_deps = 
	${esp32_base.lib_deps}

[env:release]
extends = esp32_base
build_flags = 
	${esp32_base.build_flags}
	-D INVERT
	-D CORE_DEBUG_LEVEL=0
	-Os
lib_deps = 
	${esp32_base.lib_deps}
